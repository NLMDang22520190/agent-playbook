name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Runs of one PR cancel each other; runs on main and tags are never cancelled (each ref and commit has its own group).
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    # A push to main whose tree a green PR run of this repository already tested skips the suites below.
    # It prints that run's id (nothing when there is none); any error here means the tests run.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.tree.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Find a green PR run of the same tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(bash tools/ci-tree-tested.sh "${{ github.sha }}" --repo "$GITHUB_REPOSITORY")" || run=""
          case "$run" in *[!0-9]*) run= ;; esac
          echo "reused run: ${run:-none}"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  changes:
    # Pull requests only: is the change limited to README.md and CHANGELOG.md (counts unchanged)?
    # Any error means false, and the full run happens. Push events skip this job, which also means the full run.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Is this a docs-only change
        id: docs
        run: |
          d="$(bash tools/docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" || d=false
          case "$d" in true) ;; *) d=false ;; esac
          echo "docs_only: $d"
          echo "docs_only=$d" >> "$GITHUB_OUTPUT"

  test:
    # A release tag points at a commit the push to main already tested: main-ci waits for that run instead.
    needs: [reuse, changes]
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && !(needs.reuse.result == 'success' && needs.reuse.outputs.run != '') }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2 and BSD tools: it keeps the scripts portable.
        # Windows (Git Bash) is slow to start processes: it runs as three parallel shards below.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # Git Bash on Windows; never the WSL launcher
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Versions
        run: bash --version | head -n 1; git --version; (shellcheck --version || true) | head -n 2
      - name: Docs-only checks
        # Reduced run for a docs-only PR (see the changes job): the suites that read the README or the CHANGELOG,
        # found by grep, plus the content checks and the static checks. The full step below is skipped then.
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          fail=0
          suites="$( (grep -l 'PB_ROOT/README.md' tests/test-*.sh; grep -l 'PB_ROOT/CHANGELOG.md' tests/test-*.sh; echo tests/test-content.sh) | sort -u)"
          for t in $suites; do
            echo "== $t"
            bash "$t" || fail=1
          done
          echo "== evals/run-checks.sh"
          bash evals/run-checks.sh || fail=1
          exit "$fail"
      - name: Tests and static checks
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
        run: |
          set -o pipefail
          bash tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/run-all.log"
      - name: README test count (Linux only)
        # A PR that adds tests updates the README count with tools/readme-count.sh; a stale count fails here.
        if: ${{ matrix.os == 'ubuntu-latest' && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
        run: bash tools/readme-count.sh --check "$RUNNER_TEMP/run-all.log"

  windows-shard:
    # Windows runs the same suite in Git Bash (no symlink rights: install tests use --copy), split in three.
    name: windows shard ${{ matrix.shard }}
    needs: [reuse, changes]
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && !(needs.reuse.result == 'success' && needs.reuse.outputs.run != '') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # Git Bash; never the WSL launcher
    env:
      PB_SHARD: ${{ matrix.shard }}
      PB_RERUN: '0'   # the full failure logs are already printed; re-runs could near the job timeout
      PB_JOBS: '6'   # process start-up, not CPU, is the Windows bottleneck
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Docs-only checks
        # Reduced run for a docs-only PR (see the changes job): the suites that read the README or the CHANGELOG,
        # found by grep, plus the content checks and the static checks. The full step below is skipped then.
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          fail=0
          suites="$( (grep -l 'PB_ROOT/README.md' tests/test-*.sh; grep -l 'PB_ROOT/CHANGELOG.md' tests/test-*.sh; echo tests/test-content.sh) | sort -u)"
          for t in $suites; do
            echo "== $t"
            bash "$t" || fail=1
          done
          echo "== evals/run-checks.sh"
          bash evals/run-checks.sh || fail=1
          exit "$fail"
      - name: Tests and static checks (shard)
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
        run: bash tests/run-all.sh

  windows:
    # The name branch protection requires; green only when every shard is green.
    name: test (windows-latest)
    needs: [windows-shard, reuse]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Windows shards passed, or the tree was already tested
        # Skipped shards count only when reuse succeeded and named the PR run; anything else is red.
        run: |
          echo "windows shards: ${{ needs.windows-shard.result }}, reuse: ${{ needs.reuse.result }}"
          [ "${{ needs.windows-shard.result }}" = success ] && exit 0
          [ "${{ needs.windows-shard.result }}" = skipped ] && [ "${{ needs.reuse.result }}" = success ] && [ -n "${{ needs.reuse.outputs.run }}" ] && exit 0
          exit 1

  main-ci:
    # Tag pushes only: the tagged commit was tested by its push to main; wait for that run and require success.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: The test run of this commit on main passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          for i in $(seq 1 30); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "no test run on main for $GITHUB_SHA"; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status

  release:
    # Only for v* tag pushes, after the tests pass. Never overwrites an existing release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.main-ci.result == 'success' }}
    needs: [test, windows, main-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION and CHANGELOG.md
        run: tools/check-release.sh "$GITHUB_REF_NAME"
      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; not overwriting it"
          else
            tools/check-release.sh --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
