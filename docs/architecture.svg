  <text class="t" x="950" y="178">your-project/.agents/</text>
  <rect x="948" y="196" width="274" height="50" rx="8" fill="var(--p-soft)"/>
  <text class="m" x="962" y="217">playbook.conf</text>
  <text class="s" x="962" y="236">test / lint / typecheck commands</text>
