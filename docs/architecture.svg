<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">agent-playbook: one source, every harness, every project</title>
  <desc id="d">The agent-playbook git repository is the single source: the always-on block, five skills, scripts and the installer. install.sh links or copies them into each harness on the machine: Claude Code gets a managed block in ~/.claude/CLAUDE.md and skills in ~/.claude/skills; Codex gets ~/.codex/AGENTS.md and ~/.agents/skills; OpenCode reads ~/.config/opencode/AGENTS.md or falls back to the Claude file, and reads both skill folders. Inside each project the agents keep .agents/playbook.conf, .agents/LEARNINGS.md and the hand-off folder with the spec, the decision ledger and evidence logs. Approved feedback becomes issues on the private GitHub repository; merged pull requests are tagged as releases, and install.sh update re-installs every recorded target.</desc>
  <defs>
    <style>
      :root {
        --bg: #F7F8FC; --card: #FFFFFF; --ink: #1C2333; --muted: #5B6478; --line: #DDE2EE;
        --repo: #4F5BD5; --repo-soft: #ECEEFC; --h: #1F9D63; --h-soft: #E5F6EE; --p: #C98A00; --p-soft: #FBF2DC;
        --gh: #1C2333; --gh-ink: #F7F8FC;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0F131C; --card: #171D2A; --ink: #E8ECF6; --muted: #A3ACC2; --line: #2A3347;
          --repo: #8C95FF; --repo-soft: #1E2445; --h: #4FD39A; --h-soft: #12301F; --p: #F2C04D; --p-soft: #352A0E;
          --gh: #E8ECF6; --gh-ink: #0F131C;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--ink); }
      .bg { fill: var(--bg); }
      .h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
      .sub { font-size: 14.5px; fill: var(--muted); }
      .col { font-size: 13px; font-weight: 800; letter-spacing: 1.2px; fill: var(--muted); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
      .t { font-size: 17px; font-weight: 800; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .s { font-size: 13px; fill: var(--muted); }
      .lbl { font-size: 12.5px; font-weight: 700; fill: var(--muted); }
      .arrow { fill: none; stroke: var(--muted); stroke-width: 2; }
      .ah { fill: var(--muted); }
      .gh { fill: var(--gh); }
      .ght { font-size: 16px; font-weight: 800; fill: var(--gh-ink); }
      .ghs { font-size: 13.5px; fill: var(--gh-ink); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="640" rx="18"/>
  <text class="h1" x="40" y="58">One source, every harness, every project</text>
  <text class="sub" x="40" y="84">Edit the repo once; install.sh puts it where each agent looks. Project knowledge stays in the project.</text>

  <text class="col" x="40" y="124">ONE SOURCE</text>
  <text class="col" x="470" y="124">ON THIS MACHINE</text>
  <text class="col" x="930" y="124">IN EACH PROJECT</text>

