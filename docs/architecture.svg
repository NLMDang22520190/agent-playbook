  <path class="arrow" d="M400 288 L466 288" marker-end="url(#a)"/>
  <path class="arrow" d="M400 346 C435 346 435 392 466 392" marker-end="url(#a)"/>
  <text class="lbl" x="404" y="270">install</text>
