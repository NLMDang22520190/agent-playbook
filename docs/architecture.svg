  <text class="s" x="962" y="294">evidenced, approved, max 40</text>
  <rect x="948" y="312" width="274" height="108" rx="8" fill="var(--p-soft)"/>
  <text class="m" x="962" y="333">handoff/  (git-ignored)</text>
  <text class="m" x="962" y="354">  01-spec.md · decisions.md</text>
