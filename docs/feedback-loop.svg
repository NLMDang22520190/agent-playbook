<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">Improves itself from real use</title>
  <desc id="d">In a work session on any harness and machine, a playbook rule that misfires is captured quietly as pending feedback. At the end of a task, at most once every 7 days, the user previews and approves it, and it becomes a GitHub issue in a private feedback repo. The fix comes as a pull request with an eval scenario, goes through tests and review, is merged and tagged; CI creates the release, and install.sh update refreshes every recorded install on WSL, Windows and other machines, which feeds the next work session.</desc>
  <defs>
    <style>
      :root {
        --bg: #F7F8FC; --card: #FFFFFF; --ink: #1C2333; --muted: #5B6478; --line: #DDE2EE;
        --c1: #4F5BD5; --c2: #C98A00; --c3: #D64545; --c4: #8A4FD0; --c5: #1F9D63; --c6: #12898F; --c7: #4F5BD5;
        --soft: #ECEEFC;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0F131C; --card: #171D2A; --ink: #E8ECF6; --muted: #A3ACC2; --line: #2A3347;
          --c1: #8C95FF; --c2: #F2C04D; --c3: #FF7B7B; --c4: #C29BFF; --c5: #4FD39A; --c6: #4CCFD6; --c7: #8C95FF;
          --soft: #1E2445;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--ink); }
      .bg { fill: var(--bg); }
      .h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
      .sub { font-size: 14.5px; fill: var(--muted); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
      .t { font-size: 15.5px; font-weight: 800; }
      .s { font-size: 12.5px; fill: var(--muted); }
      .el { font-size: 12.5px; fill: var(--muted); font-style: italic; }
      .arrow { fill: none; stroke: var(--muted); stroke-width: 2; }
      .ah { fill: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="470" rx="18"/>
  <text class="h1" x="40" y="48">Improves itself from real use</text>
  <text class="sub" x="40" y="74">Nothing leaves your machine until you preview and approve it.</text>

  <!-- top row -->
  <rect class="card" x="40" y="120" width="200" height="78" rx="12"/>
  <rect x="40" y="120" width="6" height="78" rx="3" style="fill:var(--c1)"/>
  <text class="t" x="62" y="152">Work session</text>
  <text class="s" x="62" y="176">any harness, any machine</text>

  <path class="arrow" d="M240,159 H342" marker-end="url(#a)"/>
  <text class="el" x="250" y="146">rule misfired:</text>
  <text class="el" x="250" y="184">capture quietly</text>

  <!-- cylinder: pending feedback -->
  <path class="card" d="M345,128 a95,14 0 0,0 190,0 v62 a95,14 0 0,1 -190,0 z" style="stroke:var(--c2)"/>
  <ellipse cx="440" cy="128" rx="95" ry="14" style="fill:var(--card);stroke:var(--c2);stroke-width:1.5"/>
  <text class="t" x="440" y="172" text-anchor="middle">pending feedback</text>
  <text class="s" x="440" y="194" text-anchor="middle">local only</text>

  <path class="arrow" d="M535,159 H692" marker-end="url(#a)"/>
  <text class="el" x="550" y="140">end of task, at most</text>
  <text class="el" x="550" y="156">once in 7 days</text>
  <text class="el" x="550" y="184">you preview + approve</text>

  <rect class="card" x="695" y="120" width="250" height="78" rx="12"/>
  <rect x="695" y="120" width="6" height="78" rx="3" style="fill:var(--c3)"/>
  <text class="t" x="717" y="152">GitHub issue</text>
  <text class="s" x="717" y="176">in your private feedback repo</text>

  <path class="arrow" d="M945,159 H1012" marker-end="url(#a)"/>

  <rect class="card" x="1015" y="120" width="225" height="78" rx="12"/>
  <rect x="1015" y="120" width="6" height="78" rx="3" style="fill:var(--c4)"/>
  <text class="t" x="1037" y="152">PR + eval scenario</text>
  <text class="s" x="1037" y="176">test first, roles, gates</text>

  <!-- down -->
  <path class="arrow" d="M1127,198 V296" marker-end="url(#a)"/>

  <!-- bottom row, right to left -->
  <rect class="card" x="1015" y="300" width="225" height="78" rx="12"/>
  <rect x="1015" y="300" width="6" height="78" rx="3" style="fill:var(--c5)"/>
  <text class="t" x="1037" y="332">Tests + review</text>
  <text class="s" x="1037" y="356">CI on Linux, macOS, Windows</text>

  <path class="arrow" d="M1015,339 H898" marker-end="url(#a)"/>
  <text class="el" x="930" y="328">merge</text>

  <rect class="card" x="645" y="300" width="250" height="78" rx="12"/>
  <rect x="645" y="300" width="6" height="78" rx="3" style="fill:var(--c6)"/>
  <text class="t" x="667" y="332">Tag <tspan class="mono">vX.Y.Z</tspan></text>
  <text class="s" x="667" y="356">CI creates the release</text>

  <path class="arrow" d="M645,339 H478" marker-end="url(#a)"/>
  <text class="el mono" x="497" y="328">install.sh update</text>

  <rect class="card" x="215" y="300" width="260" height="78" rx="12"/>
  <rect x="215" y="300" width="6" height="78" rx="3" style="fill:var(--c7)"/>
  <text class="t" x="237" y="332">Every recorded install</text>
  <text class="s" x="237" y="356">WSL, Windows, other machines</text>

  <!-- back up to work session -->
  <path class="arrow" d="M215,339 H155 V202" marker-end="url(#a)"/>
</svg>
