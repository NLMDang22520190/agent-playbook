  <path class="arrow" d="M860 288 L926 288" marker-end="url(#a)"/>
  <text class="lbl" x="866" y="278">reads at</text>
  <text class="lbl" x="866" y="306">task start</text>

  <!-- GitHub -->
  <rect class="gh" x="40" y="490" width="1200" height="96" rx="14"/>
  <text class="ght" x="64" y="526">GitHub · NLMDang22520190/agent-playbook</text>
  <text class="ghs" x="64" y="556">issues  ←  feedback.sh submit (only what you approved)      PR + eval  →  CI  →  merge  →  tag vX.Y.Z      →  install.sh update re-installs every recorded target</text>
